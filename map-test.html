<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<title>親子自律挑戰地圖（測試版）｜從神韻看見自律之美</title>
<meta name="description" content="11/22 親子自律成長活動互動地圖：點一點每個站點，看看當天會玩什麼、學什麼。" />

<!-- Q 版圓體字「粉圓體」（Google Fonts）。載入失敗時會自動改用系統字型，不影響功能 -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet" />

<!--
  ┌──────────────────────────────────────────────────────────┐
  │ 這是「測試頁」：只有地圖，沒有報名表，也沒有連到 GAS。        │
  │ 要改文字 → 往下找「設定區」，只改引號裡面的中文即可。          │
  │ 要換成 AI 插畫 → 只改設定區的 backgroundImage 那一行。       │
  └──────────────────────────────────────────────────────────┘
-->

<style>
  :root{
    --ink:#5b3a1e;               /* 插畫外框的咖啡色 */
    --cream:#fff7e8; --cream-2:#fffaf2;
    --orange:#ff6b18; --orange-dark:#e9570c;
    --yellow:#ffd95a; --mint:#dff8e9; --sky:#dff5ff; --blue:#2f95d8;
    --text:#3a2614; --muted:#7a6650; --line:#f0dfc6;
    --shadow:0 16px 36px rgba(132,84,33,.16);
    --shadow-soft:0 8px 22px rgba(132,84,33,.10);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    font-family:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",Arial,sans-serif;
    font-synthesis:none;
    color:var(--text);
    background:#fff8ec radial-gradient(circle,rgba(255,186,110,.22) 3px,transparent 4px) 0 0/38px 38px;
    line-height:1.7; font-size:16px;
    -webkit-text-size-adjust:100%;
  }
  body.sheet-open{padding-bottom:62vh}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
  button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
  a{color:inherit;text-decoration:none}
  [hidden]{display:none !important}

  .test-banner{background:#3a2614;color:#ffe9b8;text-align:center;font-size:13px;padding:6px 12px}
  .wrap{width:min(1040px,calc(100% - 24px));margin:0 auto}

  /* ===== 標題區 ===== */
  .head{padding:22px 0 8px;text-align:center}
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    background:#fff;border:2px solid var(--ink);color:var(--ink);
    border-radius:999px;padding:4px 14px;font-size:13px;
    box-shadow:0 3px 0 #e5c9a0;
  }
  .eyebrow i{width:9px;height:9px;border-radius:50%;background:var(--orange)}
  h1{
    margin:14px 0 6px;font-size:clamp(34px,9.5vw,54px);line-height:1.15;
    font-weight:900;letter-spacing:.03em;color:var(--ink);
    text-shadow:0 4px 0 #ffe0b8;
  }
  h1 em{font-style:normal;color:var(--orange);text-shadow:0 4px 0 #ffd0a8}
  .lead{margin:0 auto;max-width:560px;color:#5b4423;font-size:16px;text-wrap:balance}
  .nb{white-space:nowrap}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
  .chips span{
    background:#fff;border:2px solid #ead2ac;border-radius:999px;
    padding:2px 12px;font-size:14px;color:var(--ink);
  }
  .chips span.hot{background:var(--orange);border-color:var(--ink);color:#fff;box-shadow:0 3px 0 #b8460a}

  /* ===== 能力線按鈕 ===== */
  .lines{margin:16px 0 12px;text-align:center}
  .lines-title{font-size:15px;color:#8a4b00;margin-bottom:8px}
  .line-btns{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  .line-btn{
    --lc:#999;
    background:#fff;border:2px solid var(--ink);border-radius:999px;color:var(--ink);
    padding:5px 11px;font-size:15px;min-height:44px;
    box-shadow:0 4px 0 #e5c9a0;transition:transform .12s,box-shadow .12s;
  }
  .line-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #e5c9a0}
  .line-btn[aria-pressed="true"]{background:var(--lc);color:#fff;box-shadow:0 4px 0 rgba(60,30,0,.28)}
  .line-note{
    margin:12px auto 0;max-width:560px;min-height:3.4em;
    background:#fff;border:2px dashed #e2c08e;border-radius:18px;
    padding:8px 14px;font-size:15px;color:#5b4423;
  }

  /* ===== 版面 ===== */
  .layout{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;justify-content:center}

  /* ===== 地圖 ===== */
  .map{
    position:relative;width:100%;max-width:560px;margin:0 auto;
    aspect-ratio:3/4;border-radius:30px;overflow:hidden;
    background:#bfe7fb;border:3px solid var(--ink);
    box-shadow:0 6px 0 #e5c9a0,var(--shadow);
    touch-action:manipulation;
  }
  /* 舊版 iPhone（iOS 14 以前）不支援 aspect-ratio，用這招撐出 3:4 高度，避免地圖消失 */
  @supports not (aspect-ratio:3/4){ .map{height:0;padding-top:133.333%} }
  .map > svg, .map > .bg{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;display:block}
  .map > .bg{object-fit:cover}

  .seg{fill:none;stroke-linecap:round;opacity:0;transition:opacity .3s}
  .map[data-line="all"] .seg{opacity:.45;stroke-width:4;stroke-dasharray:2 11}
  .seg.on{opacity:1 !important;stroke-width:8 !important;stroke-dasharray:14 12 !important;animation:flow 1.1s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-26}}

  /* 站點（小建築） */
  .node{
    position:absolute;z-index:3;transform:translate(-50%,-50%);
    width:clamp(70px,20vw,96px);height:clamp(70px,20vw,96px);
    transition:transform .2s,opacity .3s,filter .3s;
  }
  .node::before{content:"";position:absolute;top:-8px;right:-8px;bottom:-8px;left:-8px;border-radius:50%} /* 加大點擊範圍 */
  .node .art{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 4px 0 rgba(91,58,30,.18))}
  .node .num{
    position:absolute;top:0;left:-2px;width:25px;height:25px;border-radius:50%;
    background:var(--orange);color:#fff;font-size:14px;line-height:1;
    display:grid;place-items:center;border:2px solid #fff;box-shadow:0 0 0 2px var(--ink);
  }
  .node .stamp{
    position:absolute;right:-2px;bottom:8px;width:26px;height:26px;border-radius:50%;
    background:#2fb36b;color:#fff;font-size:15px;line-height:1;border:2px solid #fff;box-shadow:0 0 0 2px var(--ink);
    display:none;place-items:center;
  }
  .node.done .stamp{display:grid}
  .node .lbl{
    position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:-6px;
    background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:999px;
    padding:0 9px;font-size:13px;line-height:1.65;white-space:nowrap;box-shadow:0 3px 0 rgba(91,58,30,.22);
  }
  .node.finish .art{animation:bob 2.2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .node.sel{transform:translate(-50%,-50%) scale(1.1);z-index:5}
  .node.sel .art{animation:pop .55s ease;filter:drop-shadow(0 0 4px #fff) drop-shadow(0 0 9px rgba(255,170,60,.95))}
  @keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.22) translateY(-6px)}70%{transform:scale(.96)}100%{transform:scale(1)}}
  /* 不在目前能力線上的站：小建築稍微淡化，站名仍保持清楚 */
  /* （正在看的那一站就算不在線上，也不淡化） */
  .node.dim:not(.sel) .art{opacity:.6;filter:grayscale(.55)}
  .node.dim:not(.sel) .num,.node.dim:not(.sel) .stamp{opacity:.6}
  .node.dim:not(.sel) .lbl{color:#8a7458;border-color:#b9a283;box-shadow:none}
  .node.next{z-index:4}
  .node.next::after{
    content:"點我！";position:absolute;left:64%;bottom:64%;
    background:var(--orange);color:#fff;font-size:12px;line-height:1.75;padding:0 8px;
    border-radius:999px;border:2px solid #fff;box-shadow:0 0 0 2px var(--ink);
    white-space:nowrap;pointer-events:none;animation:hop 1s ease-in-out infinite;
  }
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

  /* Q 版親子 */
  .kid{
    position:absolute;z-index:6;width:clamp(46px,14vw,72px);pointer-events:none;
    transform:translate(28%,-104%);
    transition:left .8s cubic-bezier(.4,0,.2,1),top .8s cubic-bezier(.4,0,.2,1),transform .8s cubic-bezier(.4,0,.2,1);
  }
  .kid.at-start{transform:translate(62%,-72%)} /* 在起點時站到右邊小路上，避免擋到上方標籤 */
  .kid svg{display:block;width:100%;height:auto;overflow:visible}
  .kid.walk svg{animation:hopwalk .27s ease-in-out 3}
  @keyframes hopwalk{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(-4deg)}}

  /* 集章列 */
  .progress{
    max-width:560px;margin:16px auto 0;background:#fff;border:2px solid var(--ink);
    border-radius:22px;padding:10px 14px;box-shadow:0 4px 0 #e5c9a0;
    display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;justify-content:center;
  }
  .progress b{font-weight:400;font-size:16px;color:var(--ink)}
  .stamps{display:flex;gap:7px}
  .stamps span{
    width:38px;height:38px;border-radius:50%;border:2px dashed #d9b98a;color:#c9a869;
    font-size:15px;display:grid;place-items:center;background:#fffaf2;transition:.3s;
  }
  .stamps span.on{border:2px solid var(--ink);background:#fff3c4;transform:rotate(-8deg)}
  .stamps span svg{width:32px;height:32px;display:block}
  .reset{font-size:13px;color:var(--muted);text-decoration:underline;min-height:32px;padding:0 6px}

  /* ===== 說明卡（手機＝底部滑出；電腦＝右側面板） ===== */
  .panel{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    max-height:60vh;max-height:60dvh;overflow-y:auto;overscroll-behavior:contain;
    background:#fff;border-radius:28px 28px 0 0;border-top:3px solid var(--ink);
    box-shadow:0 -12px 40px rgba(80,50,10,.28);
    padding:10px 18px calc(18px + env(safe-area-inset-bottom));
    transform:translateY(106%);visibility:hidden;
    transition:transform .35s cubic-bezier(.3,.9,.3,1),visibility 0s .35s;
  }
  .panel.open{transform:none;visibility:visible;transition:transform .35s cubic-bezier(.3,.9,.3,1)}
  .grab{width:44px;height:5px;border-radius:99px;background:#e6d6bb;margin:0 auto 10px}
  .p-head{display:flex;align-items:center;gap:12px}
  .p-ico{
    flex:none;width:66px;height:66px;border-radius:50%;background:var(--c,#ffd95a);
    display:grid;place-items:center;border:3px solid #fff;box-shadow:0 0 0 2px var(--ink);
  }
  .p-ico svg{width:56px;height:56px;display:block;overflow:visible}
  .p-title{flex:1;min-width:0}
  .p-kicker{font-size:14px;color:var(--orange-dark)}
  .p-title h2{margin:0;font-size:24px;line-height:1.25;font-weight:900;color:var(--ink)}
  .p-close{
    flex:none;width:44px;height:44px;border-radius:50%;background:#fff4e0;border:2px solid var(--ink);
    font-size:17px;color:var(--ink);box-shadow:0 3px 0 #e5c9a0;
  }
  .p-tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 2px}
  .tag{
    --lc:#999;background:#fff;border:2px solid var(--lc);color:var(--lc);
    border-radius:999px;padding:1px 11px;font-size:14px;min-height:32px;
  }
  .p-block{margin-top:12px;border-radius:18px;padding:10px 14px;border:2px solid transparent}
  .p-block h3{margin:0 0 2px;font-size:16px;font-weight:900;color:var(--ink)}
  .p-block p{margin:0;font-size:16px}
  .b-what{background:#fff3d6;border-color:#f6dca0}
  .b-learn{background:var(--mint);border-color:#b9e8c9}
  .b-parent{background:var(--sky);border-color:#b8e1f5}
  .p-extra{margin-top:12px}
  .info-list{margin:0;padding:0;list-style:none;font-size:15px}
  .info-list li{padding:5px 0;border-bottom:2px dashed var(--line)}
  .info-list b{display:inline-block;min-width:3.4em;font-weight:400;color:var(--orange-dark)}
  .prize{display:flex;gap:12px;align-items:center;margin-top:10px;background:#fffaf2;border:2px solid #f0dfc6;border-radius:18px;padding:8px}
  .prize img{flex:none;width:84px;height:84px;object-fit:cover;border-radius:14px;background:#fff}
  .prize strong{display:block;font-weight:400;font-size:16px;color:var(--ink)}
  .prize span{font-size:14px;color:#5b4423;line-height:1.55}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:6px;
    min-height:52px;border-radius:999px;padding:12px 26px;font-size:19px;letter-spacing:.04em;
    color:#fff;background:linear-gradient(180deg,#ff8a3d,var(--orange));
    border:2px solid var(--ink);box-shadow:0 5px 0 #b8460a;
    transition:transform .12s,box-shadow .12s;
  }
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b8460a}
  .btn.ghost{background:#fff4e0;color:var(--ink);box-shadow:0 5px 0 #e5c9a0}
  .p-nav{display:flex;gap:10px;margin-top:16px}
  .p-nav button{
    flex:1;min-height:50px;border-radius:16px;background:#fff4e0;border:2px solid var(--ink);
    box-shadow:0 3px 0 #e5c9a0;font-size:14px;color:var(--ink);padding:6px 10px;line-height:1.35;
  }
  .p-nav button:disabled{opacity:.35;cursor:default}
  .p-empty{text-align:center;padding:22px 8px;color:#7a6641}
  .p-empty svg{width:120px;height:auto;display:block;margin:0 auto 6px}

  /* ===== 底部報名 ===== */
  .cta{
    max-width:560px;margin:24px auto 0;text-align:center;
    background:linear-gradient(160deg,#ffe777,#ffd64f);border:3px solid var(--ink);border-radius:30px;padding:24px 18px;
    box-shadow:0 6px 0 #e5b94a;
  }
  .cta h2{margin:0;font-size:clamp(28px,7.5vw,36px);line-height:1.2;font-weight:900;color:var(--ink)}
  .cta p{margin:8px 0 18px;color:#5b4423}
  .cta .btn{max-width:360px;margin:0 auto}
  .cta small{display:block;margin-top:14px;font-size:14px;color:#6b5420}
  footer{text-align:center;color:#9a8a6a;font-size:13px;padding:22px 12px 40px}

  /* ===== 完成視窗 ===== */
  .modal{position:fixed;top:0;right:0;bottom:0;left:0;z-index:80;background:rgba(40,25,5,.55);display:flex;align-items:center;justify-content:center;padding:20px}
  .modal-card{background:#fff;border:3px solid var(--ink);border-radius:30px;padding:24px 22px;max-width:380px;width:100%;text-align:center;box-shadow:0 6px 0 #e5c9a0}
  .modal-card .big svg{width:120px;height:120px;display:block;margin:0 auto;overflow:visible}
  .modal-card h2{margin:6px 0 6px;font-size:28px;font-weight:900;color:var(--ink)}
  .modal-card p{margin:0 0 18px;color:#5b4423}
  .modal-card .btn + .btn{margin-top:12px}
  .confetti{position:fixed;top:-30px;z-index:90;font-size:26px;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}

  /* ===== 電腦版 ===== */
  @media (min-width:900px){
    body.sheet-open{padding-bottom:0}
    .layout{grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:30px;align-items:start}
    .map{margin:0}
    .progress{margin-left:0}
    .panel{
      position:sticky;top:16px;z-index:1;max-height:none;
      transform:none;visibility:visible;border-radius:30px;border:3px solid var(--ink);
      box-shadow:0 6px 0 #e5c9a0,var(--shadow);padding:18px 20px 20px;
      transition:none;
    }
    .grab,.p-close{display:none}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none !important;transition:none !important}
    html{scroll-behavior:auto}
  }
</style>
</head>

<body>
<div class="test-banner">🧪 測試版預覽（尚未公開）｜正式報名請至活動網頁</div>

<header class="head wrap">
  <span class="eyebrow"><i></i>從神韻看見自律之美・11/22 親子自律成長活動</span>
  <h1>親子自律<em>挑戰地圖</em></h1>
  <p class="lead"><span class="nb">跟著小路走一圈，</span><span class="nb">看看 11/22 下午</span><span class="nb">我們會一起玩什麼、學什麼。</span><br>點點看每個站點吧！</p>
  <div class="chips" id="chips"></div>
</header>

<section class="lines wrap" aria-label="能力線">
  <div class="lines-title">選一條能力線，看看各站怎麼串在一起 👇</div>
  <div class="line-btns" id="lineBtns"></div>
  <div class="line-note" id="lineNote" aria-live="polite"></div>
</section>

<main class="wrap">
  <div class="layout">
    <div>
      <div class="map" id="map" data-line="all">
        <!-- AI 插畫（設定區 backgroundImage 有填才會出現） -->
        <img class="bg" id="bgImg" alt="" hidden />
        <svg id="mapSvg" viewBox="0 0 600 800" aria-hidden="true">
          <g id="decor"></g>   <!-- 海、小島、樹、雲、太陽、鯨魚（程式畫的 Q 版底圖） -->
          <g id="road"></g>    <!-- 小路 -->
          <g id="segs"></g>    <!-- 能力線 -->
        </svg>
        <div class="kid" id="kid" aria-hidden="true"></div>
      </div>

      <div class="progress" id="progress">
        <b id="ptext">已探索 0/5 站</b>
        <div class="stamps" id="stamps" aria-hidden="true"></div>
        <button class="reset" id="reset" type="button">重新集章</button>
      </div>
    </div>

    <aside class="panel" id="panel" aria-label="站點說明" aria-live="polite"></aside>
  </div>

  <section class="cta" aria-label="立即報名">
    <h2>完成挑戰・人人有禮</h2>
    <p><span class="nb">免費參加，</span><span class="nb">家長 30 名＋孩子 30 名，</span><span class="nb">額滿即止</span></p>
    <a class="btn" id="ctaBtn" href="#">立即免費報名</a>
    <small>活動洽詢：<a href="tel:0913837389" style="text-decoration:underline">陳小姐 0913-837-389</a></small>
  </section>
</main>

<footer>社團法人法輪大法學會・臺灣自媒體應用科技學會 共同主辦｜測試版頁面</footer>

<div class="modal" id="done" hidden role="dialog" aria-modal="true" aria-labelledby="doneTitle">
  <div class="modal-card">
    <div class="big" id="doneArt" aria-hidden="true"></div>
    <h2 id="doneTitle">地圖挑戰完成！</h2>
    <p>5 站都探索完囉！<br>11/22 現場等你來挑戰，完成挑戰・人人有禮。</p>
    <a class="btn" id="doneCta" href="#">立即免費報名</a>
    <button class="btn ghost" id="doneClose" type="button" style="width:100%">繼續逛逛</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ============================================================
     ★★★ 設定區：要改文字、位置、報名連結，只改這一區 ★★★
     只改「引號裡面」的中文或數字，不要刪掉逗號、引號、括號。
     ============================================================ */

  var CONFIG = {
    // 「立即報名」按鈕要去的地方（結尾 ad=map 會讓報名資料記錄來源是地圖）
    registerUrl: 'index.html?ad=map#signup',

    // 報名截止時間（用來算「剩 N 天」）和畫面上顯示的截止日
    deadline: '2026-11-15T23:59:59+08:00',
    deadlineText: '11/15',

    // 之後有 AI 插畫時，把圖放進 images 資料夾，再把檔名寫在這裡。
    // 例：'images/map-bg.jpg'　　留空 '' 就是用現在程式畫的 Q 版底圖
    backgroundImage: '',

    // 有插畫時是否還要畫那條小路（插畫本身已有路就保持 false）
    showRoadOnImage: false

  function showDone() {
    $('#done').hidden = false;
    $('#doneCta').focus();
    if (window.matchMedia('(prefers-reduced-motion:reduce)').matches) return;
    var em = ['🎉', '⭐', '🎈', '✨', '🌟', '🎊', '💖'];
    for (var i = 0; i < 26; i++) {
      var c = document.createElement('span'); c.className = 'confetti'; c.textContent = em[i % em.length];
      c.style.left = (Math.random() * 96) + 'vw'; c.style.animationDuration = (2 + Math.random() * 2.2) + 's';
      c.style.animationDelay = (Math.random() * .6) + 's';
      document.body.appendChild(c); setTimeout((function (el) { return function () { el.remove(); }; })(c), 5200);
    }
  }
  $('#doneClose').addEventListener('click', function () { $('#done').hidden = true; });
  $('#done').addEventListener('click', function (e) { if (e.target === this) this.hidden = true; });

  /* ---- 其他 ---- */
  $('#reset').addEventListener('click', function () {
    visited.clear(); saveVisited(); closePanel(); updateProgress();
    moveKid(byId.start); kid.classList.remove('walk');
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!$('#done').hidden) $('#done').hidden = true; else if (current) closePanel();
  });
  if (desktop.addEventListener) desktop.addEventListener('change', function () {
    document.body.classList.toggle('sheet-open', !desktop.matches && panel.classList.contains('open'));
    if (desktop.matches && !current) renderEmpty();
  });

  $('#ctaBtn').href = CONFIG.registerUrl;
  $('#doneCta').href = CONFIG.registerUrl;

  /* ---- 開始 ---- */
  kid.style.left = byId.start.x + '%'; kid.style.top = byId.start.y + '%';
  kid.classList.add('at-start');
  renderEmpty();
  setLine('all');
  updateProgress();
})();
</script>
</body>
</html>
