name: Generate 1122 sharing JPG
on:
  push:
    paths:
      - '.github/workflows/generate-1122-og.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-og:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Chinese fonts and imaging
        run: |
          python -m pip install --quiet Pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk > /dev/null
      - name: Build 1200x630 parent-child event JPG from the organizer's real event photograph
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps, ImageDraw, ImageFont
          from pathlib import Path

          W, H = 1200, 630
          bg = Image.new('RGB', (W,H), '#f8f5ea')
          source = Image.open('images/review-1.jpg').convert('RGB')
          cropped = ImageOps.fit(source, (610,H), method=Image.Resampling.LANCZOS, centering=(0.58,0.49))
          bg.paste(cropped,(0,0))
          d=ImageDraw.Draw(bg)
          d.rectangle((610,0,W,H), fill='#f8f5ea')
          d.rectangle((610,0,620,H), fill='#dfe8d9')
          d.rounded_rectangle((30,558,206,603),radius=13, fill='#345b43')
          font='/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc'
          normal='/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc'
          bold=lambda n: ImageFont.truetype(font,n)
          medium=lambda n: ImageFont.truetype(normal,n)
          d.text((44,569),'過往活動實拍',font=medium(20),fill='#ffffff')
          x=663
          d.text((x,66),'從神韻看見自律之美',font=medium(25),fill='#72846e')
          d.text((x,139),'孩子的自律，',font=bold(52),fill='#344d3a')
          d.text((x,207),'不只是少看手機。',font=bold(46),fill='#b7724b')
          d.line((x,297,1130,297),fill='#dddecf',width=2)
          d.text((x,328),'趣味搶答  ·  影片挑戰',font=medium(27),fill='#4e6553')
          d.text((x,370),'親子互動  ·  一起成長',font=medium(27),fill='#4e6553')
          d.rounded_rectangle((x,455,1115,531),radius=22,fill='#4e7658')
          d.text((x+31,468),'11/22（日）台南・免費',font=bold(31),fill='#ffffff')
          d.text((x,558),'國小 3–6 年級｜台南維悅酒店',font=medium(20),fill='#706c5d')
          out=Path('images/1122-share-preview.jpg')
          bg.save(out,format='JPEG',quality=86,optimize=True,subsampling=0)
          print(out,Image.open(out).size,out.stat().st_size)
          PY
      - name: Commit generated preview
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add images/1122-share-preview.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Build 1122 event JPG social sharing preview"
            git push
          fi
